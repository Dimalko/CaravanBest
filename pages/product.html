<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
</head>
<body>
    <div class="bg-overlay"></div>
    <div id="header"></div>
    <main>
        <div class="product-page-container">
            <div class="product-container">
                <div class="product-gallery">
                    <img id="main-image" src="" alt="Product Image" onclick="openModal()">
                    <div class="swiper">
                        <div class="swiper-wrapper" id="thumbnails"></div>
                        <div class="swiper-button-next"></div>
                        <div class="swiper-button-prev"></div>
                    </div>
                </div>
                <div class="product-info">
                    <h1 id="product-title"></h1>
                    <p id="product-price" class="product-price"></p>
                    <hr>
                    <table class="product-details">
                        <tr><td><strong>Μάρκα: </strong></td><td class="product-details-info" id="product-brand"></td></tr>
                        <tr><td><strong>Μοντέλο: </strong></td><td class="product-details-info" id="product-model"></td></tr>
                        <tr><td><strong>Κατάσταση: </strong></td><td class="product-details-info" id="product-condition"></td></tr>
                        <tr><td><strong>Χρονολογία: </strong></td><td class="product-details-info"id="product-year"></td></tr>
                        <tr><td><strong>Βάρος: </strong></td><td class="product-details-info" id="product-weight"></td></tr>
                        <tr><td><strong>Μήκος: </strong></td><td class="product-details-info" id="product-length"></td></tr>
                        <tr><td><strong>Φάρδος: </strong></td><td class="product-details-info" id="product-width"></td></tr>
                    </table>
                </div>
            </div>
        </div>
        <div id="image-modal" class="modal">
            <span class="close" onclick="closeModal()">&times;</span>

            <span class="prev" onclick="changeImage(-1)">&#10094;</span>
            <img class="modal-content" id="modal-img">
            <span class="next" onclick="changeImage(1)">&#10095;</span>
        </div>
    </main>
    <div class="padding-block"></div>
    <div id="footer"></div>
    <script src="/assets/js/script.js"></script>
</body>
</html>
